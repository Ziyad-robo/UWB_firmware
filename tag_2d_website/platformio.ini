; PlatformIO Project Configuration File
; Each firmware type now has its own project folder and configuration.
; To build/upload, navigate to the specific project folder (e.g., tag_2d_website)
; and run 'pio run -t upload'

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_extra_dirs = ../lib
upload_port = /dev/ttyUSB1 
; monitor_speed = 115200 ; Uncomment if needed 